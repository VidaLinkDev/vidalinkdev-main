<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voluntario encontrado | VidaLink</title>
  <link rel="icon" type="image/png" href="RECURSOS/vidalink.png">
  <link rel="stylesheet" href="CSS/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <style>
  /* Chat UI tweaks */
  #chatBody { background: #ffffff; padding: 12px; }
  .chat-message { display:flex; margin:8px 0; }
  .bubble { padding:10px; max-width:72%; border-radius:12px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .bubble-me { background:#0b5ed7; color:#fff; margin-left:auto; text-align:left; }
  .bubble-vol { background:#f1f3f5; color:#0f1720; margin-right:auto; text-align:left; }
  .meta { font-size:0.78rem; color:#0b5ed7; margin-bottom: 4px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-compact">
    <div class="container-fluid">
      <img src="RECURSOS/logo.png" alt="VidaLink Logo" width="160">
    </div>
  </nav>

  <main class="container py-5">
    
    <div class="text-center mb-4">
      <h2 class="fw-bold text-success">¡Ayuda en camino!</h2>
      <p id="infoVoluntario" class="text-primary fw-bold fs-5">Conectando con el voluntario...</p>
      
      <p id="etaTexto" class="text-warning fw-bold fs-5 d-none">⏳ Tiempo estimado: calculando...</p>
      
      <div class="d-flex justify-content-center gap-3 mt-3">
        <a id="btnLlamar" href="#" class="btn btn-success d-none shadow-sm px-4 rounded-pill fw-bold">
          📞 Llamar
        </a>
        <button id="btnLlegada" class="btn btn-primary d-none shadow-sm px-4 rounded-pill fw-bold">
          ✅ ¡Ya llegó!
        </button>
      </div>
    </div>

    <div id="mapaSeguimiento" style="height: 350px; border-radius: 20px; margin-bottom: 2rem; box-shadow: 0 8px 24px rgba(0,0,0,0.12);"></div>

    <div class="card shadow-sm border-0">
      <div class="card-header bg-primary text-white fw-bold">Chat con el Voluntario</div>
      <div id="chatBody" class="card-body" style="height: 300px; overflow-y: auto;">
        <div class="text-center text-muted py-5">Cargando mensajes...</div>
      </div>
      <div class="card-footer">
        <div class="input-group">
          <input type="text" id="inputMensaje" class="form-control" placeholder="Escribe un mensaje...">
          <button class="btn btn-primary fw-bold" id="btnEnviar">Enviar</button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  
  <script type="module">
    import { db } from './SCRIPT/firebase-init.js';
    import { doc, onSnapshot, collection, query, orderBy, addDoc, serverTimestamp, getDoc, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
    import { showCustomConfirm, showCustomAlert } from './SCRIPT/utils.js';

    const urlParams = new URLSearchParams(window.location.search);
    let alertaIdActual = urlParams.get('id');

    // Si no viene por URL, intentar buscarla en localStorage
    if (!alertaIdActual) {
      const stored = JSON.parse(localStorage.getItem('emergenciaActiva'));
      if (stored && stored.alertaId) alertaIdActual = stored.alertaId;
    }

    let mapa = null;
    let markerPaciente = null;
    let markerVoluntario = null;
    let datosVoluntarioCargados = false;

    // Función matemática para calcular los kilómetros
    function calcularDistancia(lat1, lon1, lat2, lon2) {
      const R = 6371; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    if (alertaIdActual) {
      
      // 1. ESCUCHAR LA ALERTA (MAPA, ETA Y DATOS DEL VOLUNTARIO)
      onSnapshot(doc(db, "alertas", alertaIdActual), async (snap) => {
        try {
          const data = snap.data();
          if (!data) return;

          // Cargar datos del voluntario protegido con Try-Catch
          if (data.voluntarioId && !datosVoluntarioCargados) {
            try {
              const volSnap = await getDoc(doc(db, "usuarios", data.voluntarioId));
              if (volSnap.exists()) {
                const vData = volSnap.data();
                // Prioridad: Android (nombre) o Web (primerNombre)
                const nombreVol = vData.nombre || vData.primerNombre || data.voluntarioNombre || "asignado";
                
                document.getElementById('infoVoluntario').innerText = `El voluntario ${nombreVol} está en camino.`;
                
                const btnLlamar = document.getElementById('btnLlamar');
                if (vData.celular) {
                  btnLlamar.href = `tel:${vData.celular}`;
                  btnLlamar.classList.remove('d-none');
                }
                document.getElementById('btnLlegada').classList.remove('d-none');
                datosVoluntarioCargados = true;
              }
            } catch (error) {
              console.error("Fallo al leer datos del voluntario:", error);
              document.getElementById('infoVoluntario').innerText = `El voluntario está en camino.`;
            }
          } else if (!data.voluntarioId) {
              document.getElementById('infoVoluntario').innerText = "Esperando que un voluntario acepte...";
          }

          // Inicializar Mapa
          if (!mapa && data.latitud) {
            mapa = L.map('mapaSeguimiento').setView([data.latitud, data.longitud], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
            
            markerPaciente = L.marker([data.latitud, data.longitud]).addTo(mapa).bindPopup("Tu ubicación").openPopup();
            
            markerVoluntario = L.marker([data.latitud, data.longitud], {
              icon: L.icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                iconSize: [25, 41], iconAnchor: [12, 41]
              })
            }).addTo(mapa).bindPopup("El voluntario");
          }

          // Mover al voluntario y calcular ETA en minutos
          if (data.voluntarioLat && markerVoluntario && mapa) {
            const nuevaPos = [data.voluntarioLat, data.voluntarioLon];
            
            // 1. Mueve el ícono en el mapa en tiempo real
            markerVoluntario.setLatLng(nuevaPos);
            
            // 2. Solo centramos el mapa si es la PRIMERA vez que recibimos el GPS del voluntario
            // Esto permite que luego el paciente pueda mover el mapa libremente sin que rebote
            if (!window.mapaCentrado) {
                const bounds = L.latLngBounds([[data.latitud, data.longitud], nuevaPos]);
                mapa.fitBounds(bounds, { padding: [50, 50] });
                window.mapaCentrado = true; // Marcamos que ya se centró una vez
            }

            // 3. Calculamos la distancia real
            const distanciaKm = calcularDistancia(data.latitud, data.longitud, data.voluntarioLat, data.voluntarioLon);
            
            // Calculamos el ETA asumiendo que va en vehículo urbano (aprox 30 km/h)
            // Fórmula: (Distancia / Velocidad) * 60 minutos
            const minutosETA = Math.ceil((distanciaKm / 30) * 60); 
            
            const etaObj = document.getElementById('etaTexto');
            etaObj.classList.remove('d-none');
            
            // Si la distancia es menor a 100 metros (0.1 km), decimos que ya llegó
            if (distanciaKm <= 0.1) {
              etaObj.innerText = `🚨 ¡El voluntario ha llegado a tu ubicación!`;
              etaObj.className = "text-success fw-bold fs-5 mb-3 heartbeat-animation";
            } 
            else if (minutosETA <= 1) {
              etaObj.innerText = `⏳ ¡El voluntario está a menos de 1 minuto!`;
              etaObj.className = "text-danger fw-bold fs-5 mb-3";
            } else {
              etaObj.innerText = `⏳ Aprox. a ${minutosETA} minutos de tu ubicación (${(distanciaKm).toFixed(1)} km)`;
              etaObj.className = "text-warning fw-bold fs-5 mb-3";
            }
          }
        } catch (err) {
          console.error("Error procesando alerta:", err);
        }
      });

      // 2. LÓGICA DE CHAT
      const chatQuery = query(collection(db, "alertas", alertaIdActual, "mensajes"), orderBy("timestamp"));
      onSnapshot(chatQuery, (snap) => {
        const chatBody = document.getElementById('chatBody');
        chatBody.innerHTML = '';
        snap.forEach(d => {
          const m = d.data();
          const align = m.esVoluntario ? 'text-start' : 'text-end';
          const color = m.esVoluntario ? 'bg-light text-dark' : 'bg-primary text-white';
          const sender = m.esVoluntario ? 'Voluntario' : 'Tú';
          chatBody.innerHTML += `
            <div class="mb-2 ${align}">
              <div class="d-inline-block p-2 rounded ${color}" style="max-width:80%; text-align: left;">
                <small class="d-block opacity-75 fw-bold" style="font-size: 0.7em;">${sender}</small>
                ${m.texto}
              </div>
            </div>`;
        });
        chatBody.scrollTop = chatBody.scrollHeight;
      });

      // ENVIAR MENSAJE DE CHAT
      const btnEnviar = document.getElementById('btnEnviar');
      const inputMensaje = document.getElementById('inputMensaje');
      
      async function enviarMensaje() {
        if (!inputMensaje.value.trim()) return;
        btnEnviar.disabled = true;
        try {
          await addDoc(collection(db, "alertas", alertaIdActual, "mensajes"), {
            texto: inputMensaje.value.trim(),
            esVoluntario: false,
            timestamp: serverTimestamp()
          });
          inputMensaje.value = '';
          await updateDoc(doc(db, "alertas", alertaIdActual), { isTypingPaciente: deleteField() });
        } catch (error) {
          console.error("Error enviando mensaje:", error);
        } finally {
          btnEnviar.disabled = false;
        }
      }
      
      btnEnviar.addEventListener('click', enviarMensaje);
      inputMensaje.addEventListener('keypress', (e) => { if (e.key === 'Enter') enviarMensaje(); });

      // 3. CONFIRMAR LLEGADA (CIERRA LA ALERTA)
      document.getElementById('btnLlegada').addEventListener('click', () => {
        showCustomConfirm('Confirmar Llegada', '¿El voluntario ya está contigo prestando ayuda?', async () => {
          try {
            const alertaRef = doc(db, "alertas", alertaIdActual);
            const alertaSnap = await getDoc(alertaRef);
            const dataAlerta = alertaSnap.data();

            // Marcamos en la BD que la emergencia finalizó
            await updateDoc(alertaRef, { estado: "finalizada", finalizadaTimestamp: serverTimestamp() });
            
            // Liberamos al voluntario
            if(dataAlerta.voluntarioId) {
                await updateDoc(doc(db, "usuarios", dataAlerta.voluntarioId), { estadoVoluntario: "disponible" });
            }

            // Redirigimos al paciente al inicio
            showCustomAlert('¡Gracias!', 'Has confirmado la llegada. La emergencia ha sido cerrada exitosamente.', [
              { text: 'Volver al inicio', action: () => { window.location.href = 'index.html'; } }
            ]);
          } catch (error) {
            console.error("Error al finalizar:", error);
          }
        });
      });
    }
  </script>
</body>
</html>
